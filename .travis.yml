language: php
php:
  - 7.0
  - 7.2
  - 7.1
  - 7.3
  - 7.4
  - 8.1
  - 8.2
  - 8.3
  - 8.4

install:
  - composer self-update
  - composer install --prefer-source --no-interaction

before_script:
  - composer require atoum/atoum
script:
  - vendor/bin/atoum -d tests/units/

branches:
  only:
  - master
